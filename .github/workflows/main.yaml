name: Build and publish Todo app

on:
  push:
    branches:
      - main
    paths:
      - "todo-app/**"

jobs:
  build-publish:
    name: Build, Push, Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and publish frontend
        run: |-
          docker build --tag "kassudin/todo-app:$GITHUB_SHA" ./todo-app/todo-frontend
          docker push "kassudin/todo-app:$GITHUB_SHA"

      - name: Build and publish backend
        run: |-
          docker build --tag "kassudin/todo-backend:$GITHUB_SHA" ./todo-app/todo-backend
          docker push "kassudin/todo-backend:$GITHUB_SHA"

      - name: Checkout configuration repository
        uses: actions/checkout@v6
        with:
          repository: Kassudin/devopswithkub-config
          token: ${{ secrets.CONFIG_REPO_TOKEN }}
          path: config

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Use right images
        working-directory: ./config/todo-app
        run: |-
          kustomize edit set image PROJECT/TODO-APP=kassudin/todo-app:$GITHUB_SHA
          kustomize edit set image PROJECT/TODO-BACKEND=kassudin/todo-backend:$GITHUB_SHA

      - name: Commit configuration
        uses: EndBug/add-and-commit@v10
        with:
          cwd: './config'
          add: 'todo-app/kustomization.yaml'
          message: New Todo version released ${{ github.sha }}
