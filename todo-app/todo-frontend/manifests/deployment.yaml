apiVersion: apps/v1
kind: Deployment
metadata:
  name:  todo-app
  namespace: project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      volumes:
        - name: todo-volume
          persistentVolumeClaim:
            claimName: todo-claim
      containers:
      - name: todo-app
        image: kassudin/todo-app:1.4
        env:
          - name: IMAGE_URL
            value: "https://picsum.photos/1200"
          - name: BACKEND_URL
            value: "http://todo-backend-svc:2345/todos"
          - name: CACHE_DURATION
            value: "600"
          - name: PORT
            value: "3000"
          - name: IMAGE_FILE
            value: "/usr/src/app/files/image.jpg"  
        volumeMounts:
            - name: todo-volume
              mountPath: /usr/src/app/files