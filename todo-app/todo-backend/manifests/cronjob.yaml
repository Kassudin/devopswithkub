apiVersion: batch/v1
kind: CronJob
metadata:
  name: wikipedia-todo
  namespace: project
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: wikipedia-todo
              image: kassudin/todo-backend:1.2
              command: ["python", "-u", "wikipedia_todo.py"]
              env:
                - name: WIKIPEDIA_URL
                  value: "https://en.wikipedia.org/wiki/Special:Random"
                - name: BACKEND_URL
                  value: "http://todo-backend-svc:2345/todos"
          restartPolicy: Never