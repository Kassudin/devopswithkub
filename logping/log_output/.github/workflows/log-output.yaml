name: Build and publish Log Output

on:
  push:

jobs:
  build-publish:
    name: Build, Push, Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish generator
        run: |-
          docker build --tag "kassudin/log-output-generator:$GITHUB_SHA" ./logping/log_output/generator
          docker push "kassudin/log-output-generator:$GITHUB_SHA"

      - name: Build and publish reader
        run: |-
          docker build --tag "kassudin/log-reader:$GITHUB_SHA" ./logping/log_output/reader
          docker push "kassudin/log-reader:$GITHUB_SHA"

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Use right images
        working-directory: ./logping/log_output
        run: |-
          kustomize edit set image PROJECT/LOG-OUTPUT-GENERATOR=kassudin/log-output-generator:$GITHUB_SHA
          kustomize edit set image PROJECT/LOG-READER=kassudin/log-reader:$GITHUB_SHA

      - name: commit kustomization.yaml to GitHub
        uses: EndBug/add-and-commit@v10
        with:
          add: 'logping/log_output/kustomization.yaml'
          message: New Log Output version released ${{ github.sha }}