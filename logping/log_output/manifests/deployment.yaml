apiVersion: apps/v1
kind: Deployment
metadata:
  name:  log-output
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      volumes:
        - name: shared-log
          emptyDir: {}
        - name: config
          configMap:
            name: config
            items:
              - key: information.txt
                path: information.txt
      containers:
      - name: log-generator
        image: kassudin/log-output-generator:1.3
        volumeMounts:
          - name: shared-log
            mountPath: /usr/src/app/files
      - name: log-reader
        image: kassudin/log-reader:1.7
        readinessProbe:
          initialDelaySeconds: 10
          periodSeconds: 5
          httpGet:
            path: /healthz
            port: 3000
        env:
        - name: MESSAGE
          valueFrom:
            configMapKeyRef:
              name: config
              key: MESSAGE
        volumeMounts:
          - name: shared-log
            mountPath: /usr/src/app/files
          - name: config
            mountPath: /config
            readOnly: true
